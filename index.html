<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coin Sorter - K-1 Coin Recognition Game | Teacher Games</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #4CC5FD; overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", Verdana, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #selftest { position: fixed; top: 0; left: 0; z-index: 99; background: #fff; color: #111;
    font: 14px monospace; white-space: pre; padding: 12px; max-height: 100vh; overflow: auto; }
</style>
</head>
<body>
<canvas id="game" aria-label="Coin Sorter game"></canvas>
<script>
'use strict';
/* Coin Sorter — Teacher Games
   Early rung BEFORE Piggy Bank: coin ID / recognition for K-1 (+ 2.MD.C.8 foundation).
   Sort each coin into the right jar. One continuous PLAY mode. Offline single HTML. */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, OX = 0, OY = 0;
const LW = 1600, LH = 1000;
const PLUM = '#3D315F', CREAM = '#FFFDF7', GREEN = '#279363';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const irand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[irand(0, arr.length - 1)];
const X = x => OX + x * SC, Y = y => OY + y * SC, S = v => v * SC;

window.__texts = [];
window.__collectText = false;
const _fillText = CanvasRenderingContext2D.prototype.fillText;
CanvasRenderingContext2D.prototype.fillText = function (str, x, y) {
  if (window.__collectText && typeof str === 'string') window.__texts.push(str);
  return _fillText.apply(this, arguments);
};

// ---------- audio ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('tg-coin-sorter-mute') === '1'; } catch (e) {}
function tone(freq, dur, type, vol, delay, slideTo) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  click: () => tone(660, 0.08, 'sine', 0.10),
  correct: () => { tone(880, 0.10, 'triangle', 0.12); tone(1175, 0.16, 'triangle', 0.10, 0.08); },
  wrong: () => tone(280, 0.18, 'sine', 0.10, 0, 200),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.12, i * 0.11)); },
  heart: () => tone(320, 0.14, 'sine', 0.09, 0, 240),
  pop: () => tone(980, 0.08, 'sine', 0.08, 0, 1400),
};
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('tg-coin-sorter-mute', muted ? '1' : '0'); } catch (e) {}
  sfx.click();
}

// ---------- coins (cash-register visual weight) ----------
const COINS = [
  { id: 'penny',   v: 1,  label: '1¢',  name: 'Penny',   copper: true,  size: 1.00 },
  { id: 'nickel',  v: 5,  label: '5¢',  name: 'Nickel',  copper: false, size: 1.10 },
  { id: 'dime',    v: 10, label: '10¢', name: 'Dime',    copper: false, size: 0.86 },
  { id: 'quarter', v: 25, label: '25¢', name: 'Quarter', copper: false, size: 1.24 },
];
const JAR_DEFS = [
  { id: 'penny',   name: 'Penny',   label: '1¢',  glass: '#F6C39A', glassDeep: '#E08A4A', band: '#C47A3E', ribbon: '#FF8C5A' },
  { id: 'nickel',  name: 'Nickel',  label: '5¢',  glass: '#D8E2EA', glassDeep: '#A8B8C6', band: '#7A8794', ribbon: '#8AA0B8' },
  { id: 'dime',    name: 'Dime',    label: '10¢', glass: '#E4EAF0', glassDeep: '#B0BCC8', band: '#6E7C8A', ribbon: '#9BB0C4' },
  { id: 'quarter', name: 'Quarter', label: '25¢', glass: '#E8EEF4', glassDeep: '#9AABC0', band: '#5E6C7A', ribbon: '#7EC8F0' },
];

const PRAISE = ['Nice!', 'Great!', 'You got it!', 'Super!', 'Way to go!', 'Awesome!'];
const WIN_PHRASES = ['Round clear!', 'Super sorting!', 'Coin star!', 'Fantastic!'];

// ---------- state ----------
let state = 'title';
let roundNum = 0, wins = 0, hearts = 3, heartsOn = false;
let activeCoins = [];
let current = null;
let pile = [];
let jars = [];
let floaters = [], particles = [], clouds = [], daisies = [];
let msg = '', msgT = 0, winT = 0, failT = 0, winPhrase = '';
let drag = null;
let spawnWait = 0;
let ui = { buttons: [] };
let lastTime = 0, elapsed = 0;
let titleBob = 0;
let playPulse = 0;
const shotParam = parseInt(new URLSearchParams(location.search).get('shot') || '0', 10);
const selftestParam = new URLSearchParams(location.search).get('selftest') === '1';

function coinById(id) { return COINS.find(c => c.id === id); }

function availableTypes() {
  if (wins < 2) return ['penny', 'nickel'];
  if (wins < 4) return ['penny', 'nickel', 'dime'];
  if (wins < 6) return ['penny', 'nickel', 'dime', 'quarter'];
  return ['penny', 'nickel', 'dime', 'quarter'];
}
function coinsPerRound() {
  if (wins < 2) return irand(4, 5);
  if (wins < 4) return irand(5, 6);
  if (wins < 6) return irand(6, 7);
  return irand(7, 9);
}
function usePiles() { return wins >= 6; }
function spawnDelay() {
  if (wins < 4) return 0.55;
  if (wins < 6) return 0.40;
  return 0.28;
}

function startRound() {
  roundNum++;
  state = 'playing';
  heartsOn = wins >= 4;
  if (heartsOn) hearts = 3;
  jars = JAR_DEFS.map(j => ({ ...j, count: 0, _hit: null }));
  const types = availableTypes();
  const n = coinsPerRound();
  activeCoins = [];
  for (let i = 0; i < n; i++) activeCoins.push(pick(types));
  for (const t of types) {
    if (!activeCoins.includes(t)) activeCoins[irand(0, activeCoins.length - 1)] = t;
  }
  pile = [];
  current = null;
  spawnWait = 0;
  floaters = []; particles = [];
  msg = ''; msgT = 0;
  drag = null;
  spawnNext();
}

function spawnNext() {
  if (activeCoins.length === 0 && !current && pile.length === 0) {
    onRoundClear();
    return;
  }
  if (current) return;
  if (usePiles() && activeCoins.length >= 2 && pile.length === 0 && Math.random() < 0.55) {
    const k = Math.min(irand(2, 3), activeCoins.length);
    for (let i = 0; i < k; i++) pile.push(activeCoins.shift());
    current = makeCoin(pile.shift());
  } else if (activeCoins.length) {
    current = makeCoin(activeCoins.shift());
  } else if (pile.length) {
    current = makeCoin(pile.shift());
  }
}

function makeCoin(type) {
  return {
    type, x: 800, y: 300, homeX: 800, homeY: 300,
    flying: false, fx: 0, fy: 0, ft: 0, bounceT: 0, shake: false,
    appear: 0, tx: 0, ty: 0, targetJar: null,
  };
}

function onRoundClear() {
  wins++;
  state = 'win';
  winT = 0;
  winPhrase = pick(WIN_PHRASES);
  sfx.win();
  burstConfetti(800, 420);
}

function loseHeart() {
  if (!heartsOn) return;
  hearts--;
  sfx.heart();
  if (hearts <= 0) {
    state = 'fail';
    failT = 0;
  }
}

function burstConfetti(x, y) {
  for (let i = 0; i < 42; i++) {
    particles.push({
      x, y, vx: rand(-9, 9), vy: rand(-16, -5),
      life: rand(0.9, 1.5), age: 0,
      c: pick(['#FF6B9D', '#FFD93D', '#6BCB77', '#4D96FF', '#FF8C42', '#C77DFF', '#FFE27A']),
      r: rand(5, 11),
    });
  }
}

function floater(text, x, y, color) {
  floaters.push({ text, x, y, age: 0, life: 1.15, color: color || GREEN });
}

// ---------- resize ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = Math.min(W / LW, H / LH);
  OX = (W - LW * SC) / 2; OY = (H - LH * SC) / 2;
  if (!clouds.length) initDecor();
}
window.addEventListener('resize', resize);

function initDecor() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    let cx = rand(60, 1540), cy = rand(36, 170);
    // keep spawn clear of the sun pocket (top-right)
    if (cx > 1280 && cy < 200) { cx = rand(60, 1200); }
    clouds.push({ x: cx, y: cy, s: rand(0.75, 1.35), sp: rand(6, 16) });
  }
  daisies = [];
  for (let i = 0; i < 10; i++) {
    daisies.push({ x: 70 + i * 155 + (i % 3) * 20, y: 820 + (i % 2) * 40, s: rand(0.85, 1.2) });
  }
}

// ---------- drawing helpers ----------
function rrPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function text(str, x, y, size, color, align) {
  ctx.fillStyle = color || PLUM;
  ctx.font = '900 ' + Math.round(S(size)) + 'px "Comic Sans MS","Chalkboard SE","Segoe UI",Verdana,sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, X(x), Y(y));
}
function drawWoodPlank(x, y, w, h, rad) {
  const px = X(x), py = Y(y), pw = S(w), ph = S(h);
  rrPath(px, py, pw, ph, S(rad || 14));
  const g = ctx.createLinearGradient(px, py, px, py + ph);
  g.addColorStop(0, '#F0C78A');
  g.addColorStop(0.45, '#D9A45E');
  g.addColorStop(1, '#C48A42');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#5A3A1A'; ctx.lineWidth = S(5); ctx.stroke();
  // wood grain
  ctx.strokeStyle = 'rgba(120,70,20,.18)'; ctx.lineWidth = S(2);
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(px + S(16), py + ph * (i / 4));
    ctx.quadraticCurveTo(px + pw * 0.5, py + ph * (i / 4) + S(4), px + pw - S(16), py + ph * (i / 4));
    ctx.stroke();
  }
}

function drawCloud(cx, cy, s) {
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.55, 0, 7);
  ctx.arc(cx + s * 0.55, cy - s * 0.12, s * 0.42, 0, 7);
  ctx.arc(cx - s * 0.5, cy + s * 0.05, s * 0.4, 0, 7);
  ctx.arc(cx + s * 0.15, cy + s * 0.18, s * 0.48, 0, 7);
  ctx.fill();
  ctx.strokeStyle = 'rgba(61,49,95,.12)'; ctx.lineWidth = S(2); ctx.stroke();
}

function drawDaisy(x, y, s) {
  const px = X(x), py = Y(y), u = S(14 * s);
  ctx.save();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.ellipse(px + Math.cos(a) * u * 0.7, py + Math.sin(a) * u * 0.7, u * 0.45, u * 0.22, a, 0, 7);
    ctx.fillStyle = '#FFFDF7'; ctx.fill();
    ctx.strokeStyle = PLUM; ctx.lineWidth = S(1.5); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(px, py, u * 0.38, 0, 7);
  ctx.fillStyle = '#FFD93D'; ctx.fill();
  ctx.strokeStyle = '#E8A020'; ctx.lineWidth = S(2); ctx.stroke();
  ctx.restore();
}

function drawSky() {
  // saturated meadow sky like piggy / change-maker
  const g = ctx.createLinearGradient(0, Y(0), 0, Y(LH));
  g.addColorStop(0, '#4CC5FD');
  g.addColorStop(0.52, '#7AD6FF');
  g.addColorStop(0.72, '#A8E8A0');
  g.addColorStop(1, '#5CBF4A');
  ctx.fillStyle = g;
  ctx.fillRect(X(0), Y(0), S(LW), S(LH));

  for (const c of clouds) drawCloud(X(c.x), Y(c.y), S(c.s * 62));

  // sun with rays (drawn after clouds so it stays in front)
  const sx = X(1420), sy = Y(100), sr = S(78);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,230,100,.45)'; ctx.lineWidth = S(6); ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + elapsed * 0.15;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(a) * sr * 1.25, sy + Math.sin(a) * sr * 1.25);
    ctx.lineTo(sx + Math.cos(a) * sr * 1.7, sy + Math.sin(a) * sr * 1.7);
    ctx.stroke();
  }
  const sg = ctx.createRadialGradient(sx - sr * 0.25, sy - sr * 0.25, sr * 0.1, sx, sy, sr);
  sg.addColorStop(0, '#FFF6A8');
  sg.addColorStop(0.7, '#FFE66D');
  sg.addColorStop(1, '#F5C842');
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = '#E8A020'; ctx.lineWidth = S(5); ctx.stroke();
  // face
  ctx.fillStyle = 'rgba(255,140,160,.5)';
  ctx.beginPath(); ctx.arc(sx - sr * 0.35, sy + sr * 0.12, sr * 0.16, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + sr * 0.35, sy + sr * 0.12, sr * 0.16, 0, 7); ctx.fill();
  ctx.fillStyle = PLUM;
  ctx.beginPath(); ctx.arc(sx - sr * 0.22, sy - sr * 0.08, sr * 0.07, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + sr * 0.22, sy - sr * 0.08, sr * 0.07, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(sx, sy + sr * 0.08, sr * 0.32, 0.2, Math.PI - 0.2);
  ctx.strokeStyle = '#E8A020'; ctx.lineWidth = S(4); ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();

  // grass hill soft edge
  ctx.beginPath();
  ctx.moveTo(X(0), Y(760));
  ctx.quadraticCurveTo(X(400), Y(730), X(800), Y(755));
  ctx.quadraticCurveTo(X(1200), Y(780), X(1600), Y(745));
  ctx.lineTo(X(1600), Y(LH));
  ctx.lineTo(X(0), Y(LH));
  ctx.closePath();
  const gg = ctx.createLinearGradient(0, Y(740), 0, Y(LH));
  gg.addColorStop(0, '#7ED957');
  gg.addColorStop(0.5, '#5CBF4A');
  gg.addColorStop(1, '#3E9A38');
  ctx.fillStyle = gg; ctx.fill();

  // tufts
  ctx.strokeStyle = '#2F8A34'; ctx.lineWidth = S(3.5); ctx.lineCap = 'round';
  for (let i = 0; i < 48; i++) {
    const gx = X(20 + i * 34 + (i % 3) * 6), base = Y(780 + (i % 5) * 18);
    ctx.beginPath();
    ctx.moveTo(gx, base);
    ctx.quadraticCurveTo(gx - S(7), base - S(20), gx + S(3), base - S(32));
    ctx.stroke();
  }
  for (const d of daisies) drawDaisy(d.x, d.y, d.s);

  // wood shelf for jars
  const shelfY = 700;
  drawWoodPlank(60, shelfY, 1480, 36, 10);
  // shelf shadow under
  ctx.fillStyle = 'rgba(40,30,60,.15)';
  ctx.fillRect(X(80), Y(shelfY + 36), S(1440), S(10));
}

function drawBubblyLetter(ch, x, y, size, fill, outline) {
  ctx.save();
  ctx.font = '900 ' + Math.round(S(size)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const px = X(x), py = Y(y);
  for (let i = 10; i >= 1; i--) {
    ctx.fillStyle = outline;
    ctx.fillText(ch, px + S(i * 0.55), py + S(i * 0.95));
  }
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = S(size * 0.14);
  ctx.strokeText(ch, px, py);
  ctx.strokeStyle = outline;
  ctx.lineWidth = S(size * 0.05);
  ctx.strokeText(ch, px, py);
  const g = ctx.createLinearGradient(px, py - S(size * 0.4), px, py + S(size * 0.4));
  g.addColorStop(0, '#FFFFFF');
  g.addColorStop(0.35, fill);
  g.addColorStop(1, outline);
  ctx.fillStyle = g;
  ctx.fillText(ch, px, py);
  // gloss arc on letter
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath();
  ctx.ellipse(px - S(size * 0.08), py - S(size * 0.18), S(size * 0.18), S(size * 0.08), -0.4, 0, 7);
  ctx.fill();
  ctx.restore();
}

function drawBubblyTitle(str, x, y, size, fill, outline) {
  ctx.save();
  ctx.font = '900 ' + Math.round(S(size)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  const widths = [];
  let total = 0;
  for (const ch of str) {
    const w = ctx.measureText(ch).width / SC + size * 0.06;
    widths.push(w);
    total += w;
  }
  let cx = x - total / 2;
  for (let i = 0; i < str.length; i++) {
    const bob = Math.sin(titleBob * 2.2 + i * 0.55) * 4;
    drawBubblyLetter(str[i], cx + widths[i] / 2, y + bob, size, fill, outline);
    cx += widths[i];
  }
  ctx.restore();
}

// Port of cash-register drawCoin (metal sheen, copper penny, PLUM outline)
function drawCoin(type, x, y, r, alpha) {
  const d = coinById(type);
  if (!d) return;
  const R = S(r * d.size), cx = X(x), cy = Y(y);
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  // soft ground shadow
  ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.88, R * 0.72, R * 0.22, 0, 0, 7);
  ctx.fillStyle = 'rgba(40,30,60,.20)'; ctx.fill();
  const body = d.copper ? '#DC8747' : '#D7E2EC';
  const rim = d.copper ? '#B26A33' : '#A9BACA';
  const g = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  g.addColorStop(0, d.copper ? '#F0A868' : '#F2F7FB');
  g.addColorStop(0.55, body);
  g.addColorStop(1, d.copper ? '#C47A3E' : '#B9C8D6');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(2, S(r * 0.10)); ctx.strokeStyle = PLUM; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.78, 0, 7);
  ctx.lineWidth = Math.max(1.5, S(r * 0.06)); ctx.strokeStyle = rim; ctx.stroke();
  // rim highlight
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.78, Math.PI * 1.05, Math.PI * 1.55);
  ctx.lineWidth = Math.max(2, S(r * 0.09)); ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.stroke();
  // inner sheen disc
  ctx.beginPath(); ctx.arc(cx - R * 0.22, cy - R * 0.28, R * 0.28, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill();
  ctx.fillStyle = d.copper ? '#7A3E16' : PLUM;
  ctx.font = '900 ' + Math.round(R * (d.label.length > 3 ? 0.58 : 0.74)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(d.label, cx, cy + R * 0.04);
  ctx.restore();
}

function drawJar(jar, idx, total, scale) {
  scale = scale || 1;
  const spacing = 300 * scale;
  const startX = 800 - ((total - 1) * spacing) / 2;
  const jx = startX + idx * spacing;
  const jy = 560;
  const jw = 168 * scale, jh = 200 * scale;
  jar._hit = { x: jx - jw / 2 - 16, y: jy - jh / 2 - 50, w: jw + 32, h: jh + 100 };

  const px = X(jx), py = Y(jy);
  const w = S(jw), h = S(jh);

  ctx.save();
  // warm contact shadow
  ctx.beginPath();
  ctx.ellipse(px, py + h * 0.52, w * 0.55, S(14 * scale), 0, 0, 7);
  ctx.fillStyle = 'rgba(40,30,60,.22)'; ctx.fill();

  // mason jar body (trapezoid-ish rounded)
  const topW = w * 0.78, botW = w * 0.98;
  const topY = py - h * 0.42, botY = py + h * 0.42;
  ctx.beginPath();
  ctx.moveTo(px - topW / 2, topY);
  ctx.lineTo(px + topW / 2, topY);
  ctx.quadraticCurveTo(px + botW / 2, py, px + botW / 2, botY - h * 0.08);
  ctx.quadraticCurveTo(px + botW / 2, botY, px, botY);
  ctx.quadraticCurveTo(px - botW / 2, botY, px - botW / 2, botY - h * 0.08);
  ctx.quadraticCurveTo(px - botW / 2, py, px - topW / 2, topY);
  ctx.closePath();

  const bodyG = ctx.createLinearGradient(px - w / 2, topY, px + w / 2, botY);
  bodyG.addColorStop(0, 'rgba(255,255,255,.72)');
  bodyG.addColorStop(0.22, jar.glass);
  bodyG.addColorStop(0.55, jar.glassDeep);
  bodyG.addColorStop(0.78, jar.glass);
  bodyG.addColorStop(1, 'rgba(255,255,255,.35)');
  ctx.fillStyle = bodyG; ctx.fill();
  ctx.strokeStyle = PLUM; ctx.lineWidth = S(5 * scale); ctx.lineJoin = 'round'; ctx.stroke();

  // glass rim / mouth
  rrPath(px - topW * 0.52, topY - S(10 * scale), topW * 1.04, S(18 * scale), S(6));
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.strokeStyle = PLUM; ctx.lineWidth = S(4 * scale); ctx.stroke();

  // metal screw bands
  for (let b = 0; b < 3; b++) {
    const by = topY + S(8 * scale) + b * S(14 * scale);
    ctx.beginPath();
    ctx.moveTo(px - topW * 0.48, by);
    ctx.lineTo(px + topW * 0.48, by);
    ctx.strokeStyle = jar.band; ctx.lineWidth = S(5 * scale); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = S(2 * scale);
    ctx.beginPath(); ctx.moveTo(px - topW * 0.4, by - S(2)); ctx.lineTo(px + topW * 0.15, by - S(2)); ctx.stroke();
  }

  // lid (gold/silver disc)
  rrPath(px - topW * 0.58, topY - S(34 * scale), topW * 1.16, S(28 * scale), S(10));
  const lidG = ctx.createLinearGradient(px, topY - S(34 * scale), px, topY - S(6 * scale));
  lidG.addColorStop(0, '#F5E6C8');
  lidG.addColorStop(0.5, jar.band);
  lidG.addColorStop(1, '#6A5A4A');
  ctx.fillStyle = lidG; ctx.fill();
  ctx.strokeStyle = PLUM; ctx.lineWidth = S(4 * scale); ctx.stroke();
  // lid knob highlight
  ctx.beginPath(); ctx.ellipse(px, topY - S(20 * scale), S(18 * scale), S(6 * scale), 0, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fill();

  // coins stacked inside
  const n = Math.min(jar.count, 7);
  for (let i = 0; i < n; i++) {
    const cy = botY - S(28 * scale) - i * S(11 * scale);
    const cx = px + ((i % 3) - 1) * S(16 * scale);
    ctx.beginPath(); ctx.arc(cx, cy, S(15 * scale), 0, 7);
    const cg = ctx.createLinearGradient(cx - S(12), cy - S(12), cx + S(12), cy + S(12));
    if (jar.id === 'penny') {
      cg.addColorStop(0, '#F0A868'); cg.addColorStop(1, '#C47A3E');
    } else {
      cg.addColorStop(0, '#F2F7FB'); cg.addColorStop(1, '#A9BACA');
    }
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = PLUM; ctx.lineWidth = S(2); ctx.stroke();
  }

  // glossy shine streak
  ctx.beginPath();
  ctx.moveTo(px - w * 0.28, topY + S(30 * scale));
  ctx.quadraticCurveTo(px - w * 0.32, py, px - w * 0.26, botY - S(30 * scale));
  ctx.quadraticCurveTo(px - w * 0.18, py, px - w * 0.18, topY + S(40 * scale));
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.38)'; ctx.fill();

  // label plate with ribbon color
  const lw = w * 0.86, lh = S(58 * scale);
  const ly = py + h * 0.02;
  rrPath(px - lw / 2, ly, lw, lh, S(12));
  ctx.fillStyle = CREAM; ctx.fill();
  ctx.strokeStyle = PLUM; ctx.lineWidth = S(4 * scale); ctx.stroke();
  // tiny ribbon strip
  ctx.fillStyle = jar.ribbon;
  ctx.fillRect(px - lw / 2, ly, lw, S(8 * scale));
  ctx.strokeRect(px - lw / 2, ly, lw, S(8 * scale));

  ctx.fillStyle = PLUM;
  ctx.font = '900 ' + Math.round(S(22 * scale)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(jar.name, px, ly + lh * 0.52);
  ctx.font = '900 ' + Math.round(S(18 * scale)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  ctx.fillStyle = GREEN;
  ctx.fillText(jar.label, px, ly + lh * 0.82);

  // count badge
  if (jar.count > 0) {
    ctx.beginPath(); ctx.arc(px + w * 0.42, topY - S(8 * scale), S(20 * scale), 0, 7);
    ctx.fillStyle = '#FF6B9D'; ctx.fill();
    ctx.strokeStyle = PLUM; ctx.lineWidth = S(3); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + Math.round(S(18 * scale)) + 'px Verdana,sans-serif';
    ctx.fillText(String(jar.count), px + w * 0.42, topY - S(8 * scale) + S(1));
  }
  ctx.restore();
}

function drawHeart(x, y, r, fill, stroke) {
  const px = X(x), py = Y(y), R = S(r);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(px, py + R * 0.35);
  ctx.bezierCurveTo(px - R * 1.1, py - R * 0.4, px - R * 0.6, py - R * 1.15, px, py - R * 0.45);
  ctx.bezierCurveTo(px + R * 0.6, py - R * 1.15, px + R * 1.1, py - R * 0.4, px, py + R * 0.35);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = S(3.5); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(px - R * 0.25, py - R * 0.35, R * 0.18, R * 0.12, -0.5, 0, 7); ctx.fill();
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, colors, label, fontSize) {
  const px = X(x), py = Y(y), pw = S(w), ph = S(h);
  // soft shadow
  rrPath(px, py + S(6), pw, ph, ph / 2);
  ctx.fillStyle = 'rgba(40,30,60,.22)'; ctx.fill();
  rrPath(px, py, pw, ph, ph / 2);
  const g = ctx.createLinearGradient(px, py, px, py + ph);
  g.addColorStop(0, colors[0]);
  g.addColorStop(0.55, colors[1]);
  g.addColorStop(1, colors[2] || colors[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = colors[3] || PLUM; ctx.lineWidth = S(6); ctx.stroke();
  rrPath(px + S(10), py + S(8), pw - S(20), ph * 0.34, ph / 3);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '900 ' + Math.round(S(fontSize || 36)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(61,49,95,.35)';
  ctx.shadowBlur = 0; ctx.shadowOffsetY = S(3);
  ctx.fillText(label, px + pw / 2, py + ph / 2 + S(2));
  ctx.shadowOffsetY = 0;
  return { x, y, w, h };
}

function drawArrowSign(x, y, w, h, colors, label) {
  const px = X(x), py = Y(y), pw = S(w), ph = S(h);
  // post
  ctx.fillStyle = '#8B5A2B';
  ctx.fillRect(px + pw * 0.08, py + ph * 0.85, S(14), S(36));
  ctx.strokeStyle = '#5A3A1A'; ctx.lineWidth = S(3);
  ctx.strokeRect(px + pw * 0.08, py + ph * 0.85, S(14), S(36));
  ctx.beginPath();
  ctx.moveTo(px, py + ph * 0.12);
  ctx.lineTo(px + pw * 0.78, py + ph * 0.12);
  ctx.lineTo(px + pw, py + ph * 0.5);
  ctx.lineTo(px + pw * 0.78, py + ph * 0.88);
  ctx.lineTo(px, py + ph * 0.88);
  ctx.closePath();
  const g = ctx.createLinearGradient(px, py, px, py + ph);
  g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#5A3A1A'; ctx.lineWidth = S(5); ctx.stroke();
  // wood grain
  ctx.strokeStyle = 'rgba(90,58,26,.2)'; ctx.lineWidth = S(2);
  ctx.beginPath(); ctx.moveTo(px + S(10), py + ph * 0.4); ctx.lineTo(px + pw * 0.7, py + ph * 0.4); ctx.stroke();
  ctx.fillStyle = '#FFFDF7';
  ctx.font = '900 ' + Math.round(S(26)) + 'px "Comic Sans MS","Chalkboard SE",Verdana,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, px + pw * 0.42, py + ph * 0.52);
  return { x, y, w, h };
}

function drawRoundIcon(x, y, r, kind) {
  const px = X(x), py = Y(y), R = S(r);
  ctx.beginPath(); ctx.arc(px, py, R, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
  ctx.strokeStyle = PLUM; ctx.lineWidth = S(5); ctx.stroke();
  ctx.fillStyle = PLUM; ctx.strokeStyle = PLUM;
  if (kind === 'home') {
    ctx.beginPath();
    ctx.moveTo(px, py - R * 0.45);
    ctx.lineTo(px + R * 0.5, py);
    ctx.lineTo(px + R * 0.28, py);
    ctx.lineTo(px + R * 0.28, py + R * 0.45);
    ctx.lineTo(px - R * 0.28, py + R * 0.45);
    ctx.lineTo(px - R * 0.28, py);
    ctx.lineTo(px - R * 0.5, py);
    ctx.closePath(); ctx.fill();
  } else {
    // speaker
    ctx.beginPath();
    ctx.moveTo(px - R * 0.35, py - R * 0.22);
    ctx.lineTo(px - R * 0.05, py - R * 0.22);
    ctx.lineTo(px + R * 0.3, py - R * 0.48);
    ctx.lineTo(px + R * 0.3, py + R * 0.48);
    ctx.lineTo(px - R * 0.05, py + R * 0.22);
    ctx.lineTo(px - R * 0.35, py + R * 0.22);
    ctx.closePath(); ctx.fill();
    if (kind === 'mute') {
      ctx.strokeStyle = '#E0393E'; ctx.lineWidth = S(6); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px - R * 0.55, py + R * 0.55); ctx.lineTo(px + R * 0.55, py - R * 0.55); ctx.stroke();
    } else {
      ctx.strokeStyle = PLUM; ctx.lineWidth = S(4); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(px + R * 0.15, py, R * 0.42, -0.8, 0.8); ctx.stroke();
    }
  }
  return { x: x - r, y: y - r, w: r * 2, h: r * 2 };
}

function drawFooter() {
  text('BRIGHT MINDS - BRIGHTER TOMORROW', 800, 970, 20, 'rgba(61,49,95,.75)');
}

// Teacher Games cat mascot (Change Maker orange tabby + green star backpack)
function drawCatMascot(x, y, s, t) {
  const cx = X(x), cy = Y(y), u = S(s);
  const wave = Math.sin((t || elapsed) * 5) * u * 0.12;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2.5, u * 0.07);
  ctx.strokeStyle = PLUM;

  // shadow
  ctx.fillStyle = 'rgba(40,30,60,.18)';
  ctx.beginPath(); ctx.ellipse(0, u * 1.05, u * 0.7, u * 0.18, 0, 0, 7); ctx.fill();

  // legs
  ctx.fillStyle = '#F0A04B';
  rrPath(-u * 0.42, u * 0.35, u * 0.28, u * 0.55, u * 0.12); ctx.fill(); ctx.stroke();
  rrPath(u * 0.14, u * 0.35, u * 0.28, u * 0.55, u * 0.12); ctx.fill(); ctx.stroke();
  // paws
  ctx.fillStyle = '#FFE0B0';
  ctx.beginPath(); ctx.ellipse(-u * 0.28, u * 0.9, u * 0.16, u * 0.1, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(u * 0.28, u * 0.9, u * 0.16, u * 0.1, 0, 0, 7); ctx.fill(); ctx.stroke();

  // body
  const body = ctx.createLinearGradient(0, -u * 0.2, 0, u * 0.7);
  body.addColorStop(0, '#FFB45A'); body.addColorStop(1, '#E8892E');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, u * 0.15, u * 0.55, u * 0.62, 0, 0, 7); ctx.fill(); ctx.stroke();
  // belly
  ctx.fillStyle = '#FFE6C2';
  ctx.beginPath(); ctx.ellipse(0, u * 0.22, u * 0.32, u * 0.38, 0, 0, 7); ctx.fill();

  // backpack
  ctx.fillStyle = '#3DAA5C';
  rrPath(u * 0.18, -u * 0.15, u * 0.42, u * 0.55, u * 0.12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FFD93D';
  // star
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const r1 = u * 0.14, r2 = u * 0.06;
    const sx = u * 0.39 + Math.cos(a) * r1, sy = u * 0.12 + Math.sin(a) * r1;
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    const a2 = a + Math.PI / 5;
    ctx.lineTo(u * 0.39 + Math.cos(a2) * r2, u * 0.12 + Math.sin(a2) * r2);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // strap
  ctx.strokeStyle = '#2E7A44'; ctx.lineWidth = Math.max(2, u * 0.06);
  ctx.beginPath(); ctx.moveTo(-u * 0.15, -u * 0.05); ctx.quadraticCurveTo(u * 0.05, u * 0.05, u * 0.2, -u * 0.05); ctx.stroke();
  ctx.strokeStyle = PLUM; ctx.lineWidth = Math.max(2.5, u * 0.07);

  // tail
  ctx.strokeStyle = PLUM; ctx.lineWidth = Math.max(3, u * 0.12);
  ctx.beginPath();
  ctx.moveTo(-u * 0.5, u * 0.35);
  ctx.quadraticCurveTo(-u * 0.95, u * 0.1, -u * 0.75, -u * 0.25);
  ctx.stroke();
  ctx.strokeStyle = '#F0A04B'; ctx.lineWidth = Math.max(2, u * 0.08);
  ctx.beginPath();
  ctx.moveTo(-u * 0.5, u * 0.35);
  ctx.quadraticCurveTo(-u * 0.95, u * 0.1, -u * 0.75, -u * 0.25);
  ctx.stroke();
  ctx.strokeStyle = PLUM; ctx.lineWidth = Math.max(2.5, u * 0.07);

  // head
  const hg = ctx.createRadialGradient(-u * 0.1, -u * 0.75, u * 0.1, 0, -u * 0.55, u * 0.55);
  hg.addColorStop(0, '#FFC878'); hg.addColorStop(1, '#F0A04B');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, -u * 0.55, u * 0.48, 0, 7); ctx.fill(); ctx.stroke();
  // ears
  ctx.fillStyle = '#F0A04B';
  ctx.beginPath(); ctx.moveTo(-u * 0.42, -u * 0.75); ctx.lineTo(-u * 0.55, -u * 1.15); ctx.lineTo(-u * 0.12, -u * 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(u * 0.42, -u * 0.75); ctx.lineTo(u * 0.55, -u * 1.15); ctx.lineTo(u * 0.12, -u * 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FFB0C8';
  ctx.beginPath(); ctx.moveTo(-u * 0.38, -u * 0.8); ctx.lineTo(-u * 0.48, -u * 1.05); ctx.lineTo(-u * 0.2, -u * 0.9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(u * 0.38, -u * 0.8); ctx.lineTo(u * 0.48, -u * 1.05); ctx.lineTo(u * 0.2, -u * 0.9); ctx.closePath(); ctx.fill();
  // stripes
  ctx.strokeStyle = 'rgba(200,100,40,.55)'; ctx.lineWidth = Math.max(2, u * 0.05);
  for (const ox of [-0.18, 0, 0.18]) {
    ctx.beginPath(); ctx.moveTo(u * ox, -u * 0.85); ctx.quadraticCurveTo(u * ox, -u * 0.55, u * ox * 0.6, -u * 0.35); ctx.stroke();
  }
  // face
  ctx.fillStyle = PLUM;
  ctx.beginPath(); ctx.ellipse(-u * 0.16, -u * 0.58, u * 0.07, u * 0.09, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(u * 0.16, -u * 0.58, u * 0.07, u * 0.09, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-u * 0.14, -u * 0.61, u * 0.025, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(u * 0.18, -u * 0.61, u * 0.025, 0, 7); ctx.fill();
  // nose / smile
  ctx.fillStyle = '#FF7AA2';
  ctx.beginPath(); ctx.moveTo(0, -u * 0.48); ctx.lineTo(-u * 0.07, -u * 0.42); ctx.lineTo(u * 0.07, -u * 0.42); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = PLUM; ctx.lineWidth = Math.max(2, u * 0.045);
  ctx.beginPath(); ctx.arc(0, -u * 0.4, u * 0.14, 0.25, Math.PI - 0.25); ctx.stroke();
  // whiskers
  ctx.beginPath();
  ctx.moveTo(-u * 0.12, -u * 0.45); ctx.lineTo(-u * 0.45, -u * 0.5);
  ctx.moveTo(-u * 0.12, -u * 0.4); ctx.lineTo(-u * 0.45, -u * 0.38);
  ctx.moveTo(u * 0.12, -u * 0.45); ctx.lineTo(u * 0.45, -u * 0.5);
  ctx.moveTo(u * 0.12, -u * 0.4); ctx.lineTo(u * 0.45, -u * 0.38);
  ctx.stroke();

  // waving arm (left from viewer = cat's right)
  ctx.save();
  ctx.translate(-u * 0.45, -u * 0.05);
  ctx.rotate(-0.55 + wave);
  ctx.fillStyle = '#F0A04B';
  rrPath(-u * 0.12, -u * 0.12, u * 0.24, u * 0.55, u * 0.12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FFE0B0';
  ctx.beginPath(); ctx.ellipse(0, u * 0.45, u * 0.14, u * 0.12, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();

  // other arm resting
  ctx.fillStyle = '#F0A04B';
  rrPath(u * 0.32, u * 0.05, u * 0.2, u * 0.4, u * 0.1); ctx.fill(); ctx.stroke();

  ctx.restore();
}

  drawWoodPlank(40, 18, 440, 72, 14);
  text('Round ' + roundNum + '   Wins ' + wins, 260, 54, 28, PLUM);

  if (heartsOn) {
    for (let i = 0; i < 3; i++) {
      drawHeart(560 + i * 72, 54, 24,
        i < hearts ? '#F76B8E' : '#CBD6DE',
        i < hearts ? '#C2436B' : '#93A3B1');
    }
  }

  const home = drawRoundIcon(70, 140, 36, 'home');
  ui.buttons.push({ ...home, action: 'title' });
  const muteHit = drawRoundIcon(1520, 54, 38, muted ? 'mute' : 'sound');
  ui.buttons.push({ ...muteHit, action: 'mute' });

  drawWoodPlank(460, 100, 680, 60, 14);
  text('Which jar does this coin go in?', 800, 130, 28, PLUM);

  for (let i = 0; i < jars.length; i++) {
    drawJar(jars[i], i, jars.length, 1);
    const hit = jars[i]._hit;
    ui.buttons.push({ x: hit.x, y: hit.y, w: hit.w, h: hit.h, action: 'jar', jarId: jars[i].id });
  }

  pile.forEach((t, i) => drawCoin(t, 180 + i * 55, 260, 24, 0.72));

  if (drag) {
    drawCoin(drag.type, drag.x, drag.y, 52);
  } else if (current) {
    if (current.flying) {
      drawCoin(current.type, current.fx, current.fy, 48);
    } else {
      const shake = current.shake ? Math.sin(current.bounceT * 42) * 10 * Math.max(0, 1 - current.bounceT) : 0;
      const appear = Math.min(1, current.appear);
      drawCoin(current.type, current.x + shake, current.y, 52 * (0.55 + 0.45 * appear), appear);
    }
  }

  for (const f of floaters) {
    const a = 1 - f.age / f.life;
    ctx.globalAlpha = Math.max(0, a);
    text(f.text, f.x, f.y - f.age * 40, 36, f.color);
    ctx.globalAlpha = 1;
  }
  if (msgT > 0) {
    text(msg, 800, 220, 34, '#E85A7A');
  }
  drawParticles();
  drawFooter();
}

function drawWin() {
  drawPlaying();
  ctx.fillStyle = 'rgba(30,50,80,.38)';
  ctx.fillRect(X(0), Y(0), S(LW), S(LH));
  drawWoodPlank(320, 200, 960, 440, 28);
  text(winPhrase || 'Round clear!', 800, 300, 54, '#FF6B9D');
  text('All coins sorted! Ready for the next round?', 800, 380, 28, PLUM);
  const next = drawGlossyButton(520, 460, 560, 88, ['#FFE27A', '#FFB52E', '#F5A623', '#9C5F0A'], 'Next Round', 38);
  ui.buttons = [
    { ...next, action: 'next' },
    { ...drawRoundIcon(1520, 54, 38, muted ? 'mute' : 'sound'), action: 'mute' },
  ];
  drawParticles();
  drawFooter();
}

function drawFail() {
  drawSky();
  ui.buttons = [];
  drawWoodPlank(320, 200, 960, 480, 28);
  text('Good try!', 800, 320, 54, '#F76B8E');
  text("Let's try again!", 800, 400, 34, GREEN);
  text('Sort each coin into its matching jar.', 800, 460, 24, '#7A8B9C');
  const again = drawGlossyButton(520, 520, 560, 88, ['#6BCB77', '#3FA34A', '#2E8B3A', '#1F6B2A'], 'Try Again', 38);
  ui.buttons.push({ ...again, action: 'retry' });
  ui.buttons.push({ ...drawRoundIcon(70, 70, 36, 'home'), action: 'title' });
  drawFooter();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), S(p.r), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---------- update / input ----------
function update(dt) {
  elapsed += dt;
  titleBob += dt;
  for (const c of clouds) {
    c.x += c.sp * dt * 0.18;
    if (c.x > 1700) {
      c.x = -120;
      c.y = rand(36, 170);
      // re-enter left side only — stay out of the sun pocket
      if (c.y < 200) { /* ok on left */ }
    }
    // soft avoid: if overlapping sun pocket, dip lower
    if (c.x > 1280 && c.y < 200) c.y = Math.min(220, c.y + 40 * dt);
  }
  for (const p of particles) {
    p.age += dt; p.x += p.vx; p.y += p.vy; p.vy += 20 * dt;
  }
  particles = particles.filter(p => p.age < p.life);
  for (const f of floaters) f.age += dt;
  floaters = floaters.filter(f => f.age < f.life);
  if (msgT > 0) msgT -= dt;
  if (state === 'win') winT += dt;
  if (state === 'fail') failT += dt;

  if (state === 'playing') {
    if (spawnWait > 0) {
      spawnWait -= dt;
      if (spawnWait <= 0) { spawnWait = 0; spawnNext(); }
    }
  }
  if (state === 'playing' && current) {
    current.appear = Math.min(1, (current.appear || 0) + dt * 4);
    if (current.bounceT > 0) {
      current.bounceT += dt;
      if (current.bounceT > 0.45) { current.bounceT = 0; current.shake = false; }
    }
    if (current.flying) {
      current.ft += dt * 2.4;
      const t = Math.min(1, current.ft);
      const ease = t * (2 - t);
      current.fx = current.x + (current.tx - current.x) * ease;
      current.fy = current.y + (current.ty - current.y) * ease - Math.sin(t * Math.PI) * 90;
      if (t >= 1) {
        const jar = jars.find(j => j.id === current.targetJar);
        if (jar) jar.count++;
        current = null;
        spawnWait = spawnDelay();
      }
    }
  }
}

function trySort(jarId) {
  if (state !== 'playing' || !current || current.flying || drag) return;
  if (current.type === jarId) {
    const jar = jars.find(j => j.id === jarId);
    const hit = jar._hit;
    current.flying = true;
    current.ft = 0;
    current.x = current.x; current.y = current.y;
    current.tx = hit.x + hit.w / 2;
    current.ty = hit.y + hit.h * 0.35;
    current.targetJar = jarId;
    sfx.correct();
    floater(pick(PRAISE), 800, 230, GREEN);
    burstConfetti(800, 280);
  } else {
    current.bounceT = 0.001;
    current.shake = true;
    sfx.wrong();
    msg = 'Try again!';
    msgT = 1.2;
    floater('Try again!', 800, 230, '#E85A7A');
    loseHeart();
  }
}

function dropOnJar(jarId, type, fromX, fromY) {
  if (state !== 'playing') return;
  if (type === jarId) {
    const jar = jars.find(j => j.id === jarId);
    const hit = jar._hit;
    current = {
      type, x: fromX, y: fromY, flying: true, ft: 0, appear: 1,
      tx: hit.x + hit.w / 2, ty: hit.y + hit.h * 0.35, targetJar: jarId,
      bounceT: 0, shake: false,
    };
    sfx.correct();
    floater(pick(PRAISE), 800, 230, GREEN);
    burstConfetti(800, 280);
  } else {
    current = { type, x: 800, y: 300, homeX: 800, homeY: 300, flying: false, appear: 1, bounceT: 0.001, shake: true, ft: 0 };
    sfx.wrong();
    msg = 'Try again!';
    msgT = 1.2;
    floater('Try again!', 800, 230, '#E85A7A');
    loseHeart();
  }
}

function logicalPos(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX != null ? e.clientX : e.touches[0].clientX) - rect.left;
  const cy = (e.clientY != null ? e.clientY : e.touches[0].clientY) - rect.top;
  return { x: (cx - OX) / SC, y: (cy - OY) / SC };
}

function hitButton(lx, ly) {
  for (let i = ui.buttons.length - 1; i >= 0; i--) {
    const b = ui.buttons[i];
    if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) return b;
  }
  return null;
}

function onPointerDown(e) {
  e.preventDefault();
  if (AC && AC.state === 'suspended') AC.resume();
  const p = logicalPos(e);
  const b = hitButton(p.x, p.y);
  if (b) {
    if (b.action === 'mute') { toggleMute(); return; }
    if (b.action === 'play') { sfx.pop(); startRound(); return; }
    if (b.action === 'learn') { sfx.click(); state = 'learn'; return; }
    if (b.action === 'succeed') { sfx.click(); state = 'succeed'; return; }
    if (b.action === 'title') { sfx.click(); state = 'title'; current = null; drag = null; return; }
    if (b.action === 'next') { sfx.click(); startRound(); return; }
    if (b.action === 'retry') { sfx.click(); startRound(); return; }
    if (b.action === 'jar' && state === 'playing' && current && !current.flying) {
      trySort(b.jarId);
      return;
    }
  }
  if (state === 'playing' && current && !current.flying) {
    const dx = p.x - current.x, dy = p.y - current.y;
    if (dx * dx + dy * dy < 75 * 75) {
      drag = { type: current.type, x: p.x, y: p.y };
      current = null;
    }
  }
}

function onPointerMove(e) {
  if (!drag) return;
  e.preventDefault();
  const p = logicalPos(e);
  drag.x = p.x; drag.y = p.y;
}

function onPointerUp(e) {
  if (!drag) return;
  e.preventDefault();
  const p = logicalPos(e);
  const type = drag.type;
  const fromX = drag.x, fromY = drag.y;
  drag = null;
  let dropped = false;
  for (const jar of jars) {
    const h = jar._hit;
    if (h && p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) {
      dropOnJar(jar.id, type, fromX, fromY);
      dropped = true;
      break;
    }
  }
  if (!dropped) {
    current = { type, x: 800, y: 300, homeX: 800, homeY: 300, flying: false, appear: 1, bounceT: 0, shake: false, ft: 0 };
  }
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', () => {
  if (drag) {
    current = { type: drag.type, x: 800, y: 300, flying: false, appear: 1, bounceT: 0, shake: false, ft: 0 };
    drag = null;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
  if (e.key === 'Escape') { state = 'title'; current = null; drag = null; return; }
  if (state === 'title' && (e.key === 'Enter' || e.key === ' ')) { startRound(); return; }
  if (state === 'win' && (e.key === 'Enter' || e.key === ' ')) { startRound(); return; }
  if (state === 'fail' && (e.key === 'Enter' || e.key === ' ')) { startRound(); return; }
  if (state !== 'playing' || !current || current.flying) return;
  const map = { '1': 'penny', '2': 'nickel', '3': 'dime', '4': 'quarter' };
  if (map[e.key]) trySort(map[e.key]);
});

// ---------- draw / shot / selftest ----------
function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#3AA8E0';
  ctx.fillRect(0, 0, W, H);
  if (state === 'title') drawTitle();
  else if (state === 'learn') drawLearn();
  else if (state === 'succeed') drawSucceed();
  else if (state === 'playing') drawPlaying();
  else if (state === 'win') drawWin();
  else if (state === 'fail') drawFail();
}

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
  lastTime = ts;
  update(dt);
  draw(ts / 1000);
  requestAnimationFrame(frame);
}

function applyShot() {
  titleBob = 1.2;
  playPulse = 1;
  elapsed = 2;
  if (shotParam === 1) {
    state = 'title';
  } else if (shotParam === 2) {
    wins = 3; heartsOn = false;
    jars = JAR_DEFS.map(j => ({ ...j, count: j.id === 'penny' ? 2 : j.id === 'nickel' ? 1 : 0, _hit: null }));
    activeCoins = ['dime', 'penny', 'nickel'];
    current = makeCoin('dime');
    current.appear = 1;
    pile = [];
    roundNum = 4;
    state = 'playing';
    // force jar hit boxes by drawing once after resize
  } else if (shotParam === 3) {
    wins = 2;
    jars = JAR_DEFS.map(j => ({ ...j, count: 3, _hit: null }));
    current = null;
    state = 'win';
    winT = 1;
    winPhrase = 'Super sorting!';
    burstConfetti(800, 400);
  }
}

function runSelfTest() {
  const R = [];
  const ok = (name, cond, info) => R.push({ name, pass: !!cond, info: info || '' });
  window.__texts = []; window.__collectText = true;
  resize();
  state = 'title'; draw(0);
  const playBtns = ui.buttons.filter(b => b.action === 'play');
  ok('exactly one PLAY control on title', playBtns.length === 1, 'n=' + playBtns.length);
  ok('title has LEARN sign', ui.buttons.some(b => b.action === 'learn'));
  ok('title has SUCCEED sign', ui.buttons.some(b => b.action === 'succeed'));
  ok('Teacher Games in page title', /Teacher Games/.test(document.title));
  startRound();
  ok('PLAY starts playing', state === 'playing');
  ok('early types are penny+nickel', JSON.stringify(availableTypes()) === '["penny","nickel"]');
  wins = 0; heartsOn = false;
  current = makeCoin('penny'); current.appear = 1;
  draw(0);
  trySort('nickel');
  ok('wrong sort stays playing with Try again', state === 'playing' && /Try again/i.test(msg), msg);
  trySort('penny');
  ok('correct sort flies', current && current.flying);
  // finish fly
  if (current) { current.ft = 1; update(0.01); }
  wins = 5; heartsOn = true; hearts = 3;
  ok('hearts unlock after several wins', wins >= 4);
  state = 'title'; draw(0);
  const footers = window.__texts.filter(t => t.includes('BRIGHT MINDS'));
  ok('footer BRIGHT MINDS - BRIGHTER TOMORROW', footers.length > 0 && footers.every(t => t === 'BRIGHT MINDS - BRIGHTER TOMORROW'), footers[0] || 'none');
  window.__collectText = false;
  const fails = R.filter(r => !r.pass);
  const pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.textContent = R.map(r => (r.pass ? 'PASS ' : 'FAIL ') + r.name + (r.info ? '  [' + r.info + ']' : '')).join('\n');
  document.body.appendChild(pre);
  document.title = 'SELFTEST ' + fails.length + ' FAILURES';
}

// hooks for tests / screenshots
window.__cs = {
  state: () => state, wins: () => wins, startRound, draw, update, applyShot,
  uiKeys: () => ui.buttons.map(b => b.action),
};

resize();
if (selftestParam) {
  runSelfTest();
} else if (shotParam >= 1 && shotParam <= 3) {
  applyShot();
  update(0.5);
  draw(1.5);
  // freeze: no RAF so screenshot is stable
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
