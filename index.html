<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coin Sorter</title></head><body><script>
(async()=>{try{const u='https://raw.githubusercontent.com/chive55/coin-sorter-preview/main/index.html?cache='+Date.now();let s=await(await fetch(u)).text();const a=s.indexOf('  // sun with rays'),b=s.indexOf('  for (const c of clouds) drawCloud',a);if(a<0||b<0)throw Error('source patch markers not found');const sun=s.slice(a,b),line=s.slice(b,s.indexOf('\n',b));s=s.slice(0,a)+line+'\n\n'+sun+s.slice(b+line.length);document.open();document.write(s);document.close()}catch(e){document.body.textContent='Coin Sorter could not load: '+e.message}})();
</script></body></html>
